{# Ads render only once site.json has ads.client, so there is never an empty reserved gap. #}
{% if site.ads_enabled %}
<aside class="ad" aria-label="जाहिरात">
  <p class="ad-label">जाहिरात</p>
  <ins class="adsbygoogle" style="display:block" data-ad-client="{{ site.ads.client }}"
       data-ad-slot="{{ slot | default('') }}" data-ad-format="auto" data-full-width-responsive="true"></ins>
</aside>
{% endif %}
