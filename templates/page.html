{% extends "base.html" %}
{% block content %}
<div class="wrap">
<nav class="crumbs" aria-label="मार्ग"><a href="{{ url('/') }}">मुख्यपृष्ठ</a> <span aria-hidden="true">›</span> <span>{{ page.title }}</span></nav>
<article class="post">
  <header class="post-head"><h1>{{ page.title }}</h1>{% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}</header>
  <div class="body">{{ page.html | safe }}</div>
</article>
</div>
{% endblock %}
