name: Upgrade images to AI

# Run manually (Actions tab -> Upgrade images to AI -> Run workflow) after adding the Cloudflare secrets:
# replaces designed title cards with AI illustrations for posts that have an image_prompt.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate AI images
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m blogtool images --upgrade
      - name: Commit and deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static data
          if git diff --cached --quiet; then echo "nothing to change"; exit 0; fi
          git commit -m "Upgrade post images"
          git push origin main
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
