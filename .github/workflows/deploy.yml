name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 * * * *"        # hourly: publishes posts whose scheduled time has arrived
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Validate posts (stops the deploy if any post breaks the quality/safety rules)
        run: python -m blogtool validate
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: python -m blogtool build --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
