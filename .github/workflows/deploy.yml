name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Posts are future-dated (WRITING_GUIDE publish times) and only go live on a build that runs after their
    # time. GitHub runs scheduled workflows best-effort and drops many under load - the hourly entry alone
    # fired about once every four hours - so each publish slot gets its own entry a few minutes after it.
    - cron: "5 2 * * *"         # 07:35 IST, just after the 07:30 technology slot
    - cron: "35 6 * * *"        # 12:05 IST, just after the 12:00 ai slot
    - cron: "35 11 * * *"       # 17:05 IST, just after the 17:00 finance slot
    - cron: "35 14 * * *"       # 20:05 IST, just after the 20:00 health slot
    - cron: "20 * * * *"        # hourly backstop: publishes posts whose scheduled time has arrived
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Validate posts (stops the deploy if any post breaks the quality/safety rules)
        run: python -m blogtool validate
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: python -m blogtool build --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
